
# Render Blueprint for Shipyard Management Portal

services:
  - type: web
    name: ship-portal-api
    runtime: python
    plan: free
    rootDir: backend
    buildCommand: pip install -r requirements.txt
    startCommand: gunicorn app:app

    envVars:
      - key: PYTHON_VERSION
        value: "3.12.16"

      - key: DATABASE_URL
        fromDatabase:
          name: ship-portal-db
          property: connectionString

      - key: CORS_ORIGINS
        sync: false

      - key: SECRET_KEY
        generateValue: true

      - key: ADMIN_USERNAME
        value: admin

      - key: ADMIN_PASSWORD
        sync: false

databases:
  - name: ship-portal-db
    plan: free
